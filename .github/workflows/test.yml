name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20, 22, 24]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Disable autocrlf (Windows)
        if: matrix.os == 'windows-latest'
        run: git config --global core.autocrlf false

      - run: npm test

  validate:
    # Fast, clearly-named guard for release-breaking manifest regressions
    # (version mismatch, re-declaring the auto-loaded hooks/hooks.json). The
    # full matrix above also runs this via `npm test`; this surfaces it as its
    # own check so a manifest failure is obvious without reading matrix logs.
    name: validate manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node --test test/manifest.test.js
